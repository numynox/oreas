name: Deploy to GitHub Pages

# Manual only (Actions → Deploy to GitHub Pages → Run workflow). GitHub Pages is not enabled
# for this private repo yet; `on: {}` is not a valid trigger and made every push show a failed run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # No secrets here: on GitHub Pages the app runs in "direct" mode and each user
      # enters their own Airtable token in Settings (stored in their browser only).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
