services:
  oreas:
    build: .
    image: oreas:latest
    container_name: oreas
    restart: unless-stopped
    ports:
      - "${OREAS_PORT:-8080}:80"
    environment:
      # Set these in a .env next to this file, or in the Dockhand stack's environment variables.
      AIRTABLE_API_KEY: ${AIRTABLE_API_KEY:?Set AIRTABLE_API_KEY}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:?Set AIRTABLE_BASE_ID}
